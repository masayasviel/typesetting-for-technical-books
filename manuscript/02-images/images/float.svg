<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Noto Sans CJK JP, sans-serif">
  <rect width="640" height="300" fill="#fff"/>
  <g font-size="14" text-anchor="middle" fill="#222">
    <text x="160" y="24">位置固定（その場に置く）</text>
    <text x="480" y="24">ページフロート（float: top）</text>
  </g>
  <!-- left: in-place -->
  <g transform="translate(70,40)">
    <rect width="180" height="250" fill="#fafafa" stroke="#333"/>
    <g fill="#ccc">
      <rect x="14" y="14" width="152" height="7"/><rect x="14" y="28" width="152" height="7"/>
      <rect x="14" y="42" width="152" height="7"/><rect x="14" y="56" width="152" height="7"/>
      <rect x="14" y="70" width="152" height="7"/><rect x="14" y="84" width="152" height="7"/>
      <rect x="14" y="98" width="152" height="7"/><rect x="14" y="112" width="100" height="7"/>
    </g>
    <rect x="14" y="128" width="152" height="108" fill="none" stroke="#c0392b" stroke-dasharray="5 4"/>
    <text x="90" y="178" text-anchor="middle" font-size="12" fill="#c0392b">図が入らず</text>
    <text x="90" y="196" text-anchor="middle" font-size="12" fill="#c0392b">大きな空白</text>
  </g>
  <!-- right: page float -->
  <g transform="translate(390,40)">
    <rect width="180" height="250" fill="#fafafa" stroke="#333"/>
    <rect x="14" y="12" width="152" height="80" fill="#eef3fb" stroke="#3b6fb6"/>
    <text x="90" y="57" text-anchor="middle" font-size="13" fill="#3b6fb6">図（ページ上端）</text>
    <g fill="#ccc">
      <rect x="14" y="104" width="152" height="7"/><rect x="14" y="118" width="152" height="7"/>
      <rect x="14" y="132" width="152" height="7"/><rect x="14" y="146" width="152" height="7"/>
      <rect x="14" y="160" width="152" height="7"/><rect x="14" y="174" width="152" height="7"/>
      <rect x="14" y="188" width="152" height="7"/><rect x="14" y="202" width="152" height="7"/>
      <rect x="14" y="216" width="152" height="7"/><rect x="14" y="230" width="110" height="7"/>
    </g>
  </g>
</svg>
